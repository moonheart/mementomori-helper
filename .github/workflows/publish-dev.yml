name: Publish dev Build

# master -> "dev" 预发布; v*.*.* 标签 -> 正式 release (zip + docker)
on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 前端打包 + 各平台单文件自包含版本 + start 脚本, 和本地发版用同一个脚本
      - name: Build
        run: ./build-release.sh win-x64 linux-x64 linux-arm64 linux-arm osx-x64 osx-arm64
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          tag_name: dev
          prerelease: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.zip
            release/*.tar.gz

  publish-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web
        working-directory: web
        run: npx -y pnpm@9.15.0 install --frozen-lockfile && npx -y pnpm@9.15.0 exec tsc -b && npx -y pnpm@9.15.0 exec vite build
      - name: Install Android workload
        run: |
          dotnet workload install android
          dotnet build MementoMori.Android -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory=$ANDROID_HOME -p:AcceptAndroidSDKLicenses=True
      # 和旧版 APK 同一个 keystore/包名, 可以直接覆盖安装; 没有 secret (fork) 就用调试签名
      - name: Build APK
        env:
          KEYSTORE_BASE64_ENCODED: ${{ secrets.KEYSTORE_BASE64_ENCODED }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SIGN=()
          if [ -n "$KEYSTORE_BASE64_ENCODED" ]; then
            echo "$KEYSTORE_BASE64_ENCODED" | base64 -d > "$RUNNER_TEMP/mementomori-helper.keystore"
            SIGN=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/mementomori-helper.keystore" -p:AndroidSigningKeyAlias=mementomori-helper
                  -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD)
          fi
          VERSION=0.0.0
          [[ $GITHUB_REF == refs/tags/v* ]] && VERSION=${GITHUB_REF_NAME#v}
          dotnet publish MementoMori.Android -c Release -p:AndroidSdkDirectory=$ANDROID_HOME -p:ApplicationDisplayVersion=$VERSION -p:ApplicationVersion=${{ github.run_number }} "${SIGN[@]}" -o publish-android
          cp publish-android/*-Signed.apk MementoMori-android.apk
      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          files: MementoMori-android.apk
          tag_name: dev
          prerelease: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MementoMori-android.apk

  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            moonheartmoon/mementomori-webui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: .
          file: ./MementoMori.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
