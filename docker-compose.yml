# Oracle: Caddy (mm.5maple.com, basicauth) → 127.0.0.1:5290
services:
  mementomori:
    image: mementomori-api:latest
    container_name: mementomori-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5290:8080"
    volumes:
      - ../data:/data
    environment:
      - Game__AutoRequestDelay=500   # 2026-10-24 不加延迟刷 boss 被 403 过
      - TZ=America/Bogota
    mem_limit: 1g
